<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Кирилл Лукьяненко</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f5f5f2;--ink:#0d0d0e;--mut:#5f5f64}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0b;--ink:#f3f3f1;--mut:#a0a0a6}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
h1{font-size:clamp(34px,7vw,64px);line-height:1.05;letter-spacing:-.04em;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
p{color:var(--mut);margin-top:14px;animation:in .9s .1s cubic-bezier(.2,.8,.2,1) both}
a{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;margin-top:28px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;animation:in .9s .2s cubic-bezier(.2,.8,.2,1) both;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
a:hover{transform:translateY(-2px)}
@keyframes in{from{opacity:0;filter:blur(10px);transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>Такой страницы нет</h1>
<p>Возможно, ссылка устарела или в адресе опечатка.</p>
<a id="home" href="/">На главную</a>
</main>
<script>
(function(){var h=location.hostname,p=location.pathname.split('/').filter(Boolean);
if(/\.github\.io$/.test(h)&&p.length)document.getElementById('home').href='/'+p[0]+'/';})();
</script>
</body>
</html>
